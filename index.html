<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UmmahHub - Réseau Social Musulman</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --primary: #00D9A3;
      --secondary: #6366F1;
      --dark-bg: #1A1A2E;
      --dark-card: #252538;
      --light-bg: #F8F9FA;
      --light-card: #FFFFFF;
      --text-dark: #1A1A2E;
      --text-light: #F8F9FA;
      --accent: #FFB800;
      --border: #E0E0E0;
      --success: #10B981;
      --shadow: rgba(0, 0, 0, 0.1);
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--light-bg);
      color: var(--text-dark);
      transition: background 0.3s, color 0.3s;
    }
    
    body.dark-mode {
      background: var(--dark-bg);
      color: var(--text-light);
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 80px;
    }
    
    /* Header */
    .header {
      background: var(--light-card);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px var(--shadow);
    }
    
    body.dark-mode .header {
      background: var(--dark-card);
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }
    
    .logo {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .icon-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    
    .icon-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    
    body.dark-mode .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      background: var(--light-card);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      position: sticky;
      top: 66px;
      z-index: 99;
    }
    
    body.dark-mode .nav-tabs {
      background: var(--dark-card);
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }
    
    .nav-tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      border: none;
      background: none;
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    
    .nav-tab:hover {
      background: rgba(0, 0, 0, 0.03);
    }
    
    body.dark-mode .nav-tab:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .nav-tab.active {
      border-bottom-color: var(--primary);
      color: var(--primary);
    }
    
    /* Content Sections */
    .content-section {
      display: none;
      padding: 20px;
    }
    
    .content-section.active {
      display: block;
    }
    
    /* Post Card */
    .post-card {
      background: var(--light-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px var(--shadow);
      animation: fadeIn 0.3s ease;
    }
    
    body.dark-mode .post-card {
      background: var(--dark-card);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .post-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      margin-right: 12px;
      font-size: 18px;
    }
    
    .post-author {
      flex: 1;
    }
    
    .author-name {
      font-weight: 700;
      font-size: 15px;
    }
    
    .post-time {
      font-size: 13px;
      opacity: 0.6;
    }
    
    .post-content {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    
    .post-image {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    
    .post-actions {
      display: flex;
      gap: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    
    body.dark-mode .post-actions {
      border-top-color: rgba(255, 255, 255, 0.1);
    }
    
    .action-btn {
      background: none;
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: inherit;
      opacity: 0.7;
      transition: all 0.2s;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 6px;
    }
    
    .action-btn:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.05);
    }
    
    body.dark-mode .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .action-btn.active {
      opacity: 1;
      color: var(--primary);
    }
    
    /* Prayer Times Card */
    .prayer-card {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 16px;
      padding: 24px;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 217, 163, 0.3);
    }
    
    .prayer-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .prayer-date {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 20px;
    }
    
    .prayer-times {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    
    .prayer-time {
      background: rgba(255, 255, 255, 0.15);
      padding: 12px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    
    .prayer-name {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 4px;
    }
    
    .prayer-hour {
      font-size: 20px;
      font-weight: 700;
    }
    
    .prayer-time.next {
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.5);
    }
    
    /* Quote Card */
    .quote-card {
      background: var(--light-card);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
      box-shadow: 0 2px 8px var(--shadow);
    }
    
    body.dark-mode .quote-card {
      background: var(--dark-card);
    }
    
    .quote-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }
    
    .quote-text {
      font-size: 16px;
      line-height: 1.8;
      font-style: italic;
      margin-bottom: 12px;
    }
    
    .quote-source {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
    }
    
    /* Profile */
    .profile-header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      color: white;
      margin-bottom: 20px;
    }
    
    .profile-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 4px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      margin: 0 auto 16px;
    }
    
    .profile-name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .profile-bio {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 20px;
    }
    
    .profile-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      display: block;
    }
    
    .stat-label {
      font-size: 13px;
      opacity: 0.9;
    }
    
    .setting-item {
      background: var(--light-card);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px var(--shadow);
    }
    
    body.dark-mode .setting-item {
      background: var(--dark-card);
    }
    
    .setting-label {
      font-size: 15px;
      font-weight: 600;
    }
    
    .toggle {
      width: 48px;
      height: 28px;
      background: var(--border);
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .toggle.active {
      background: var(--primary);
    }
    
    .toggle-thumb {
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.3s;
    }
    
    .toggle.active .toggle-thumb {
      transform: translateX(20px);
    }
    
    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--light-card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      z-index: 100;
      box-shadow: 0 -2px 8px var(--shadow);
    }
    
    body.dark-mode .bottom-nav {
      background: var(--dark-card);
      border-top-color: rgba(255, 255, 255, 0.1);
    }
    
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: inherit;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s;
      font-size: 12px;
    }
    
    .nav-item.active {
      opacity: 1;
      color: var(--primary);
    }
    
    .nav-icon {
      font-size: 24px;
    }
    
    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 32px;
      animation: spin 2s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* Responsive */
    @media (max-width: 480px) {
      .prayer-times {
        grid-template-columns: 1fr;
      }
      
      .profile-stats {
        gap: 20px;
      }
    }
  </style>
</head>

<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">🕌 UmmahHub</div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" title="Changer le thème">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </div>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showSection('feed')">Fil</button>
    <button class="nav-tab" onclick="showSection('prayers')">Prières</button>
    <button class="nav-tab" onclick="showSection('profile')">Profil</button>
  </div>

  <div class="container">
    <!-- Feed Section -->
    <div id="feed-section" class="content-section active">
      <div id="feed-container"></div>
    </div>

    <!-- Prayers Section -->
    <div id="prayers-section" class="content-section">
      <div id="prayer-times-container">
        <div class="loading">⏳</div>
      </div>
      
      <div class="quote-card">
        <div class="quote-icon">📖</div>
        <div class="quote-text" id="daily-quote">Chargement...</div>
        <div class="quote-source" id="quote-source"></div>
      </div>
    </div>

    <!-- Profile Section -->
    <div id="profile-section" class="content-section">
      <div class="profile-header">
        <div class="profile-avatar">AZ</div>
        <div class="profile-name">Ahmed Zaidi</div>
        <div class="profile-bio">Étudiant en informatique 🎓 | Passionné de tech & spiritualité 🌙</div>
        <div class="profile-stats">
          <div class="stat">
            <span class="stat-value">42</span>
            <span class="stat-label">Posts</span>
          </div>
          <div class="stat">
            <span class="stat-value">1.2k</span>
            <span class="stat-label">Abonnés</span>
          </div>
          <div class="stat">
            <span class="stat-value">384</span>
            <span class="stat-label">Abonnements</span>
          </div>
        </div>
      </div>

      <div class="setting-item">
        <div class="setting-label">Notifications prières</div>
        <div class="toggle active" onclick="this.classList.toggle('active')">
          <div class="toggle-thumb"></div>
        </div>
      </div>

      <div class="setting-item">
        <div class="setting-label">Rappel quotidien</div>
        <div class="toggle active" onclick="this.classList.toggle('active')">
          <div class="toggle-thumb"></div>
        </div>
      </div>

      <div class="setting-item">
        <div class="setting-label">Mode focus</div>
        <div class="toggle" onclick="this.classList.toggle('active')">
          <div class="toggle-thumb"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // ==========================================
    // MOCK DATA
    // ==========================================
    
    const mockPosts = [
      {
        id: 1,
        author: 'Fatima Rahman',
        avatar: 'FR',
        time: 'Il y a 2h',
        content: 'Subhanallah, quelle belle journée pour apprendre et grandir dans notre foi. N\'oublions jamais que chaque moment est une opportunité de se rapprocher d\'Allah 🤲',
        likes: 24,
        comments: 8,
        shares: 3,
        liked: false
      },
      {
        id: 2,
        author: 'Youssef Benali',
        avatar: 'YB',
        time: 'Il y a 5h',
        content: 'Rappel : "Les meilleures personnes sont celles qui sont les plus utiles aux autres" - Hadith. Comment pouvez-vous aider quelqu\'un aujourd\'hui ? 💚',
        likes: 67,
        comments: 15,
        shares: 12,
        liked: true
      },
      {
        id: 3,
        author: 'Aisha Mansour',
        avatar: 'AM',
        time: 'Il y a 8h',
        content: 'Alhamdulillah pour tout ! Chaque difficulté est une opportunité de renforcer notre patience et notre confiance en Allah. Keep going brothers and sisters! 🌟',
        likes: 89,
        comments: 23,
        shares: 18,
        liked: false
      },
      {
        id: 4,
        author: 'Ibrahim Hassan',
        avatar: 'IH',
        time: 'Il y a 12h',
        content: 'Nouvelle série de cours sur les fondamentaux de l\'Islam disponible sur notre chaîne ! Idéal pour les débutants et ceux qui veulent réviser leurs bases. Barakallahu fikoum 📚',
        likes: 156,
        comments: 34,
        shares: 45,
        liked: true
      },
      {
        id: 5,
        author: 'Mariam Khalil',
        avatar: 'MK',
        time: 'Hier',
        content: 'Belle rencontre aujourd\'hui à la mosquée. Les sœurs qui organisent les cours de coran font un travail incroyable MashAllah. Qu\'Allah les récompense 🕌',
        likes: 43,
        comments: 12,
        shares: 7,
        liked: false
      }
    ];

    const islamicQuotes = [
      {
        text: 'Et quiconque craint Allah, Il lui donnera une issue favorable, et lui accordera Ses dons par des moyens sur lesquels il ne comptait pas.',
        source: 'Coran 65:2-3'
      },
      {
        text: 'Les actes ne valent que par leurs intentions.',
        source: 'Hadith - Sahih al-Bukhari'
      },
      {
        text: 'Certes, c\'est dans le rappel d\'Allah que les cœurs se tranquillisent.',
        source: 'Coran 13:28'
      },
      {
        text: 'Le meilleur d\'entre vous est celui qui a le meilleur comportement.',
        source: 'Hadith - Sahih al-Bukhari'
      },
      {
        text: 'Allah n\'impose à aucune âme une charge supérieure à sa capacité.',
        source: 'Coran 2:286'
      }
    ];

    // ==========================================
    // STATE MANAGEMENT
    // ==========================================
    
    const AppState = {
      posts: [...mockPosts],
      currentSection: 'feed',
      darkMode: false,
      prayerTimes: null
    };

    // ==========================================
    // NAVIGATION
    // ==========================================
    
    window.showSection = (section) => {
      // Update tabs
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.classList.remove('active');
      });
      event.target.classList.add('active');

      // Update sections
      document.querySelectorAll('.content-section').forEach(sec => {
        sec.classList.remove('active');
      });
      document.getElementById(`${section}-section`).classList.add('active');

      AppState.currentSection = section;

      // Load data if needed
      if (section === 'prayers' && !AppState.prayerTimes) {
        loadPrayerTimes();
      }
    };

    // ==========================================
    // THEME TOGGLE
    // ==========================================
    
    window.toggleTheme = () => {
      AppState.darkMode = !AppState.darkMode;
      document.body.classList.toggle('dark-mode');
      document.getElementById('theme-icon').textContent = AppState.darkMode ? '☀️' : '🌙';
    };

    // ==========================================
    // FEED RENDERING
    // ==========================================
    
    function renderFeed() {
      const container = document.getElementById('feed-container');
      container.innerHTML = AppState.posts.map(post => `
        <div class="post-card">
          <div class="post-header">
            <div class="avatar">${post.avatar}</div>
            <div class="post-author">
              <div class="author-name">${post.author}</div>
              <div class="post-time">${post.time}</div>
            </div>
          </div>
          <div class="post-content">${post.content}</div>
          <div class="post-actions">
            <button class="action-btn ${post.liked ? 'active' : ''}" onclick="toggleLike(${post.id})">
              <span>${post.liked ? '❤️' : '🤍'}</span>
              <span>${post.likes}</span>
            </button>
            <button class="action-btn" onclick="alert('Fonctionnalité commentaires à venir!')">
              <span>💬</span>
              <span>${post.comments}</span>
            </button>
            <button class="action-btn" onclick="alert('Fonctionnalité partage à venir!')">
              <span>🔄</span>
              <span>${post.shares}</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    window.toggleLike = (postId) => {
      const post = AppState.posts.find(p => p.id === postId);
      if (post) {
        post.liked = !post.liked;
        post.likes += post.liked ? 1 : -1;
        renderFeed();
      }
    };

    // ==========================================
    // PRAYER TIMES (REAL API!)
    // ==========================================
    
    async function loadPrayerTimes() {
      try {
        const container = document.getElementById('prayer-times-container');
        container.innerHTML = '<div class="loading">⏳</div>';

        // Using Aladhan API - Default to Paris
        const response = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Paris&country=France&method=2');
        const data = await response.json();
        
        if (data.code === 200) {
          AppState.prayerTimes = data.data.timings;
          renderPrayerTimes(data.data);
        }
      } catch (error) {
        document.getElementById('prayer-times-container').innerHTML = `
          <div class="prayer-card">
            <div style="text-align: center;">
              <div style="font-size: 32px; margin-bottom: 12px;">🕌</div>
              <div>Impossible de charger les horaires de prière</div>
              <div style="font-size: 14px; opacity: 0.8; margin-top: 8px;">Vérifiez votre connexion internet</div>
            </div>
          </div>
        `;
      }
    }

    function renderPrayerTimes(data) {
      const timings = data.timings;
      const date = data.date;
      
      const prayers = [
        { name: 'Fajr', time: timings.Fajr },
        { name: 'Dhuhr', time: timings.Dhuhr },
        { name: 'Asr', time: timings.Asr },
        { name: 'Maghrib', time: timings.Maghrib },
        { name: 'Isha', time: timings.Isha }
      ];

      // Find next prayer
      const now = new Date();
      const currentTime = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
      let nextPrayerIndex = prayers.findIndex(p => p.time > currentTime);
      if (nextPrayerIndex === -1) nextPrayerIndex = 0; // Next is Fajr tomorrow

      const container = document.getElementById('prayer-times-container');
      container.innerHTML = `
        <div class="prayer-card">
          <div class="prayer-title">🕌 Horaires de Prière</div>
          <div class="prayer-date">${date.readable} • ${date.hijri.month.ar} ${date.hijri.year}</div>
          <div class="prayer-times">
            ${prayers.map((prayer, index) => `
              <div class="prayer-time ${index === nextPrayerIndex ? 'next' : ''}">
                <div class="prayer-name">${prayer.name}</div>
                <div class="prayer-hour">${prayer.time}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ==========================================
    // DAILY QUOTE
    // ==========================================
    
    function loadDailyQuote() {
      const today = new Date().getDate();
      const quote = islamicQuotes[today % islamicQuotes.length];
      
      document.getElementById('daily-quote').textContent = quote.text;
      document.getElementById('quote-source').textContent = quote.source;
    }

    // ==========================================
    // INITIALIZATION
    // ==========================================
    
    function init() {
      console.log('🕌 UmmahHub Demo Initialized');
      renderFeed();
      loadDailyQuote();
      
      // Check if dark mode preferred
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        toggleTheme();
      }
    }

    // Start app
    init();
  </script>
</body>
</html>
