<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink" 
     viewBox="0 0 800 600" 
     width="800" 
     height="600">
  <title>Clickable SVG Test - Multiple Interactive Zones</title>
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="blueGrad">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    
    <linearGradient id="greenGrad">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <linearGradient id="purpleGrad">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="42" 
        font-weight="bold" text-anchor="middle" fill="#fff">
    Interactive SVG Test
  </text>
  
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="18" 
        text-anchor="middle" fill="#94a3b8">
    Click on any element below to test interactivity
  </text>
  
  <!-- ZONE 1: Logo (cliquable vers site web) -->
  <a xlink:href="https://github.com/Tryboy869/SVG-animations" target="_blank">
    <g id="logo-zone" style="cursor: pointer;">
      <circle cx="400" cy="240" r="60" fill="url(#blueGrad)" filter="url(#glow)">
        <animate attributeName="r" values="60;65;60" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Hover ring -->
      <circle cx="400" cy="240" r="60" fill="none" stroke="#00d9ff" stroke-width="3" opacity="0">
        <set attributeName="opacity" to="0.8" begin="mouseover"/>
        <set attributeName="opacity" to="0" begin="mouseout"/>
        <animate attributeName="r" values="60;75" dur="0.3s" begin="mouseover" fill="freeze"/>
        <animate attributeName="r" values="75;60" dur="0.3s" begin="mouseout" fill="freeze"/>
      </circle>
      
      <text x="400" y="255" font-family="monospace" font-size="48" 
            font-weight="bold" fill="#fff" text-anchor="middle">
        SA
      </text>
      
      <text x="400" y="330" font-family="Arial, sans-serif" font-size="16" 
            text-anchor="middle" fill="#3b82f6" font-weight="600">
        Click me - Visit GitHub Repo
      </text>
    </g>
  </a>
  
  <!-- ZONE 2: Documentation Button -->
  <a xlink:href="https://github.com/Tryboy869" target="_blank">
    <g id="docs-button" style="cursor: pointer;" transform="translate(200, 430)">
      <rect x="-90" y="-28" width="180" height="56" rx="28" fill="url(#greenGrad)">
        <animate attributeName="opacity" values="1;0.8" begin="mouseover" dur="0.2s" fill="freeze"/>
        <animate attributeName="opacity" values="0.8;1" begin="mouseout" dur="0.2s" fill="freeze"/>
      </rect>
      
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="20" 
            font-weight="bold" fill="#fff" text-anchor="middle">
        Documentation
      </text>
    </g>
  </a>
  
  <!-- ZONE 3: Demo Button -->
  <a xlink:href="https://github.com/Tryboy869/SVG-animations/tree/main/templates" target="_blank">
    <g id="demo-button" style="cursor: pointer;" transform="translate(600, 430)">
      <rect x="-90" y="-28" width="180" height="56" rx="28" fill="url(#purpleGrad)">
        <animate attributeName="opacity" values="1;0.8" begin="mouseover" dur="0.2s" fill="freeze"/>
        <animate attributeName="opacity" values="0.8;1" begin="mouseout" dur="0.2s" fill="freeze"/>
      </rect>
      
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="20" 
            font-weight="bold" fill="#fff" text-anchor="middle">
        View Templates
      </text>
    </g>
  </a>
  
  <!-- ZONE 4: Text Links -->
  <g transform="translate(400, 540)">
    <a xlink:href="https://github.com/Tryboy869/SVG-animations/issues" target="_blank">
      <text x="-120" y="0" font-family="Arial, sans-serif" font-size="16" 
            text-anchor="middle" fill="#64748b" style="cursor: pointer;">
        Issues
        <set attributeName="fill" to="#3b82f6" begin="mouseover"/>
        <set attributeName="fill" to="#64748b" begin="mouseout"/>
      </text>
    </a>
    
    <a xlink:href="https://github.com/Tryboy869" target="_blank">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" 
            text-anchor="middle" fill="#64748b" style="cursor: pointer;">
        GitHub Profile
        <set attributeName="fill" to="#3b82f6" begin="mouseover"/>
        <set attributeName="fill" to="#64748b" begin="mouseout"/>
      </text>
    </a>
    
    <a xlink:href="https://github.com/Tryboy869/SVG-animations/blob/main/CONTRIBUTING.md" target="_blank">
      <text x="120" y="0" font-family="Arial, sans-serif" font-size="16" 
            text-anchor="middle" fill="#64748b" style="cursor: pointer;">
        Contribute
        <set attributeName="fill" to="#3b82f6" begin="mouseover"/>
        <set attributeName="fill" to="#64748b" begin="mouseout"/>
      </text>
    </a>
  </g>
  
  <!-- Instructions -->
  <rect x="50" y="170" width="700" height="40" rx="8" fill="rgba(59, 130, 246, 0.1)" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="195" font-family="Arial, sans-serif" font-size="14" 
        text-anchor="middle" fill="#3b82f6" font-weight="600">
    If you can click these elements, GitHub allows interactive SVG links!
  </text>
</svg>